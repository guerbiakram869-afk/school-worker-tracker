services:
  - type: web
    name: school-worker-tracker
    runtime: node
    plan: free
    buildCommand: npm install && cd client && npm install && npm run build && cd ..
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false # Set your secure admin password in the Render dashboard
      - key: COOKIE_SECRET
        generateValue: true
      - key: DB_PATH
        value: /tmp/attendance.db
